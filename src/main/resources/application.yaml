
spring:
  application:
    name: backend-study-25-sns
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/sns-db-v3
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

# 3주차: JWT 서명 키는 환경변수로 관리
jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 3600
